<!doctype html>
<html lang="en" class="scroll-smooth" data-theme="green">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var t = localStorage.getItem('bd-theme')
        if (t === 'blue' || t === 'maroon' || t === 'green' || t === 'yellow') {
          document.documentElement.setAttribute('data-theme', t)
        }
      } catch (e) {}
    </script>
    <link rel="icon" type="image/png" href="/src/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Business Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="font-sans text-txt antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
